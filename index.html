<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf7f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saigonesee Recipe">
<title>Saigonesee Recipe</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
--bg:#faf7f0;--panel:#f1ebdc;--card:#ffffff;--line:#c9bfa9;--ink:#111111;--muted:#5a5348;
--brand:#7a5f00;--brand-solid:#f3d03e;--on-brand:#111111;--err:#a3261b;
--display:Nunito,'Be Vietnam Pro',system-ui,sans-serif;
--body:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}
.brand{font-family:var(--display);font-weight:600;letter-spacing:.04em;color:var(--brand);font-size:20px}
#lock h1{margin:0;font-family:var(--display);font-weight:600;font-size:34px;line-height:38px;text-align:center}
#lock p{margin:0;color:var(--muted);font-size:15px}
.dots{display:flex;gap:14px;height:20px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dot.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#msg{min-height:20px;color:var(--err);font-size:14px;font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.key{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-family:var(--display);font-size:30px;font-weight:500}
.key:active{background:var(--brand-solid)}
.key.ghost{border:none;background:transparent;font-family:var(--body);font-size:15px;color:var(--muted)}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto}
.top h1{margin:0;font-family:var(--display);font-weight:600;font-size:24px;line-height:28px}
.top h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--brand);letter-spacing:.06em}
#lockBtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.searchwrap{max-width:900px;margin:10px auto 0;position:relative}
#q{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 42px 0 14px;font:inherit;font-size:16px;color:var(--ink)}
#q:focus{outline:2px solid var(--brand);outline-offset:0}
#clear{position:absolute;right:6px;top:6px;width:34px;height:34px;border:none;background:transparent;font-size:20px;color:var(--muted)}
.chips{max-width:900px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.sub .chip{font-size:13px;padding:5px 12px}
.chips.sub .chip[aria-pressed=true]{background:var(--brand-solid);color:var(--on-brand);border-color:var(--brand-solid)}
main{max-width:900px;margin:0 auto;padding:12px 16px 40px}
#count{font-size:13px;color:var(--muted);margin:2px 0 10px}
.group{font-family:var(--display);font-weight:600;font-size:18px;margin:18px 0 8px}
.group:first-child{margin-top:4px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:64px}
.item:active{background:var(--panel)}
.item .vi{font-weight:600;font-size:16px;line-height:21px}
.item .en{font-size:13px;color:var(--muted)}
.newbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:4px 0 14px}
.newbox h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.newbox p{margin:0 0 10px;color:var(--muted);font-size:13px}
.newrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.newrow .item{flex:0 0 220px;scroll-snap-align:start}
.newtag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;background:var(--brand-solid);color:var(--on-brand);border-radius:99px;padding:2px 8px;vertical-align:middle}
.item .when{font-size:12px;color:var(--muted)}
.item .tag{margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--brand);text-transform:uppercase}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

#detail{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.dhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:2}
#back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.dbody{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.dbody .tag{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--brand);text-transform:uppercase}
.dbody h2{margin:4px 0 0;font-family:var(--display);font-weight:600;font-size:30px;line-height:34px}
.dbody .en{color:var(--muted);font-size:16px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.meta span{background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px}
.meta b{font-weight:600}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:22px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td{padding:11px 14px;border-bottom:1px solid var(--panel);font-size:16px;vertical-align:top}
tr:last-child td{border-bottom:none}
td.amt{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;width:1%}
ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;line-height:23px}
ol li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand-solid);color:var(--on-brand);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.note{background:var(--panel);border-left:4px solid var(--brand);border-radius:8px;padding:11px 14px;font-size:15px;line-height:22px;margin-top:8px}
.ro{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
.tabs{max-width:900px;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.tab{border:none;background:transparent;border-radius:9px;padding:9px 0;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#learn{max-width:900px;margin:0 auto;padding:12px 16px 60px}
.lsub{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lesson summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;font-size:17px}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-solid);display:flex;align-items:center;justify-content:center;font-size:14px}
.lesson summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.lesson[open] summary .chev{transform:rotate(90deg)}
.lbody{padding:0 16px 16px;font-size:16px;line-height:24px}
.lbody svg{display:block;width:100%;max-width:420px;height:auto;margin:4px auto 12px}
.lbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lbody .tip{background:var(--panel);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:15px}
.gloss{width:100%;border-collapse:collapse}
.gloss td{padding:9px 10px;border-bottom:1px solid var(--panel);vertical-align:top;font-size:15px}
.gloss td:first-child{font-weight:600;white-space:nowrap}
.allg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.allg div{background:var(--panel);border-radius:10px;padding:9px 11px;font-size:14px;line-height:19px}
.allg b{display:block;font-size:15px}
.cupgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cupcard{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.cupcard svg{width:96px;height:auto}
.cupcard .vi{font-weight:600;font-size:14px;line-height:18px}
.cupcard .en{font-size:12px;color:var(--muted)}
.cupbox{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.cupbox svg{flex:none;width:110px;height:auto}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{flex:none;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.18)}
.legend small{color:var(--muted);font-size:12px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.qt{font-family:var(--display);font-weight:600;font-size:21px;line-height:27px;margin:12px 0 14px}
.qs{color:var(--muted);font-size:14px;margin:10px 0 0}
.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.qopts{display:grid;gap:8px}.qopts.tf{grid-template-columns:1fr 1fr}
.qopt{font:inherit;font-size:16px;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.qopts.tf .qopt{text-align:center;font-weight:600;font-size:18px}
.qopt.ok{border-color:#2e7d4f;background:#e6f4ea;color:#14532d}
.qopt.bad{border-color:#b42318;background:#fdecea;color:#7a1a12}
.qopt.dim{opacity:.5}
.qcups{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cupopt{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:13px;padding:8px}
.cupopt svg{width:86px;height:auto}
.qwhy{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:15px;line-height:21px}
.qwhy.ok{background:#e6f4ea;color:#14532d}.qwhy.bad{background:#fdecea;color:#7a1a12}
.qres{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--bg);font-size:16px;text-align:center}
.me-row{display:flex;gap:12px;align-items:center}
.lvl{flex:none;width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.me-txt{flex:1;min-width:0}.me-txt b{display:block;font-size:17px}.me-txt small{display:block;color:var(--muted);font-size:13px}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;align-self:flex-start;padding:4px}
.nmlab{display:block;font-size:14px;font-weight:600;margin-top:12px}
.nmlab input{display:block;width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.lb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.lb-head h3{margin:0;font-size:17px}
.lb{list-style:none;margin:10px 0 0;padding:0;gap:0}
.lb li::before{content:none}
.lb li{display:flex;align-items:center;gap:10px;padding:9px 6px;border:0;border-top:1px solid var(--line);border-radius:0;background:none}
.lb li.me{background:var(--bg);border-radius:10px}
.lb .rk{width:28px;text-align:center;font-weight:700}
.lb .nm{flex:1;min-width:0;font-weight:600}.lb .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lb .xp{font-weight:700;text-align:right}.lb .xp small{font-weight:400;color:var(--muted);font-size:11px;margin-left:2px}
.lb-empty{color:var(--muted);font-size:14px;padding:12px 0 2px}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fstat{font-size:13px;color:var(--muted);margin-top:10px}
.topr{display:flex;gap:8px;align-items:center}
.langsw{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
#lock .langsw{margin:-4px auto 10px;display:block}
.fig{display:block;width:100%;height:620px;border:0;background:transparent;margin:6px 0 10px}
.figwrap{margin:14px -4px 0}
</style>
</head>
<body>
<section id="lock">
<div class="brand">SAIGONESEE</div>
<h1>Recipe</h1>
<p id="hint">Nhập mã 4 số để mở</p>
<button type="button" class="langsw" data-lang>English</button>
<div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div id="msg" role="status"></div>
<div class="pad" id="pad"></div>
</section>
<div id="app" class="hidden">
<header>
<div class="top">
<h1><small>SAIGONESEE</small>Recipe</h1>
<div class="topr"><button type="button" class="langsw" data-lang>EN</button><button id="lockBtn" type="button">Khóa</button></div>
</div>
<div class="tabs" role="tablist"><button type="button" class="tab" role="tab" data-view="recipes" aria-selected="true" data-i="Công thức|Recipes">Công thức</button><button type="button" class="tab" role="tab" data-view="learn" aria-selected="false" data-i="Học|Learn">Học</button></div>
<div class="searchwrap">
<input id="q" type="search" placeholder="Tìm món hoặc nguyên liệu…" autocomplete="off" enterkeyhint="search">
<button id="clear" type="button" aria-label="Xóa" class="hidden">×</button>
</div>
<div class="chips" id="types"></div>
<div class="chips sub" id="cats"></div>
</header>
<main>
<div id="count"></div>
<div id="results"></div>
</main>
<section id="learn" class="hidden"></section>
</div>
<div id="detail" class="hidden" role="dialog" aria-modal="true">
<div class="dhead"><button id="back" type="button" data-i="← Quay lại|← Back">← Quay lại</button></div>
<div class="dbody" id="dbody"></div>
